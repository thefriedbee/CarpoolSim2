[project]
name = "carpoolsim"
version = "0.1.0"
description = "A scalable program to match drive alone trips into carpools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contextily>=1.7.1",
    "geopandas>=1.1.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "osmnx>=2.1.1",
    "pandas>=2.3.0",
    "pyyaml>=6",
    "rustworkx",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]
app = ["streamlit>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
