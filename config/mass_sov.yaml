# Door-to-door carpool for a sample of the morning drive-alone trips.
# Times are minutes. Distances are kilometers. A ratio compares the carpool
# tour with the driver's own trip. This is the mass-trip scale setting.
# The Georgia Tech screen stays in config/gt_2022.yaml.

horizon: 5
dt: 2.5
et: null
commit: window
assigner: matching
max_size: 50

modes:
  - name: sov
    filters:
      - filter: FilterDepartureTime
        delta1: 5
      - filter: FilterOriginEuclideanDistance
        r1: 5
      - filter: FilterRerouteEuclideanDistance
        mu_1: 1.5
      - filter: FilterRerouteTravelTime
        gamma_1: 1.5
      - filter: FilterSharedTravelTime
        gamma_2: 0.5
      - filter: FilterPassengerWaitTime
        delta2: 10
