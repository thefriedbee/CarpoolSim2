# Set passenger waiting to 20 minutes.
# Times are minutes; distances are kilometers; other numeric filters are ratios.
horizon: 15.0
dt: 5.0
et: null
commit: window
assigner: matching
max_size: 100
modes:
- name: direct
  filters:
  - filter: FilterDepartureTime
    delta1: 15.0
  - filter: FilterOriginEuclideanDistance
    r1: 5.0
  - filter: FilterRerouteEuclideanDistance
    mu_1: 1.5
  - filter: FilterRerouteTravelTime
    gamma_1: 1.5
  - filter: FilterSharedTravelTime
    gamma_2: 0.5
  - filter: FilterPassengerWaitTime
    delta2: 20.0
